<section class="tech-section" id="technologies">
  <div class="tech-shell">
    <div class="section-heading">
      <span class="section-kicker">Tech stack</span>
      <h2>Tecnologias que uso</h2>
      <p>
        Herramientas enfocadas en backend escalable, frontend claro y entrega
        profesional de software.
      </p>
    </div>

    <div class="tech-grid">
      @for (tech of technologies; track tech.name) {
        <article class="tech-card">
          <div class="tech-icon">
            <img [src]="tech.icon" [alt]="tech.name" loading="lazy" />
          </div>
          <h3>{{ tech.name }}</h3>
          <p>{{ tech.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
