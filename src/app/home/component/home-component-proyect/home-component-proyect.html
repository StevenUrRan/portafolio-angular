<div class="project-grid">
  @for (item of homeProjects; track item.title) {
    <article class="project-card">
      <a class="project-media" [href]="item.repoUrl || '#'" target="_blank" rel="noreferrer">
        <img [src]="item.img" [alt]="item.title" loading="lazy" />
      </a>

      <div class="project-content">
        <div>
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>

        <div class="project-stack" aria-label="Tecnologias del proyecto">
          @for (tech of item.stack; track tech) {
            <span>{{ tech }}</span>
          }
        </div>

        <div class="project-actions">
          <a
            class="project-link project-link--primary"
            [class.project-link--disabled]="!item.liveUrl"
            [href]="item.liveUrl || null"
            [attr.target]="item.liveUrl ? '_blank' : null"
            [attr.rel]="item.liveUrl ? 'noreferrer' : null"
            [attr.aria-disabled]="!item.liveUrl"
          >
            Live Demo
          </a>

          @if (item.repoUrl) {
            <a class="project-link" [href]="item.repoUrl" target="_blank" rel="noreferrer">
              GitHub
            </a>
          }
        </div>
      </div>
    </article>
  }
</div>
