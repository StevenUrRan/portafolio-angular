<!-- Navigation -->
<nav
  class="fixed top-0 w-full z-50 transition-all duration-300"
  [ngClass]="{
    'py-4 px-6 md:px-8 bg-white/70 backdrop-blur-md border-b border-gray-200/50 shadow-sm text-black': isScrolled,
    'py-6 md:py-8 px-6 md:px-8 bg-transparent text-black': !isScrolled
  }"
>
  <div class="flex justify-between items-center relative z-50">
    <a
      [routerLink]="['/home']"
      routerLinkActive="active"
      class="display-font text-2xl font-bold tracking-tighter hover:opacity-70 transition-all duration-300 text-black active:scale-110 active:text-black active:tracking-tight"
    >
      {{ evn.nameHeader }}
    </a>

    <!-- Menú Desktop -->
    <div class="menu hidden md:flex">
      @for (item of menuItems; track item.title) {
        <a [routerLink]="item.route" [fragment]="item.fragment" class="link">
          <span class="link-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="192"
              height="192"
              fill="currentColor"
              viewBox="0 0 256 256"
            >
              @switch (item.icon) {
                @case ('house') {
                  <rect width="256" height="256" fill="none"></rect>
                  <path
                    d="M213.3815,109.61945,133.376,36.88436a8,8,0,0,0-10.76339.00036l-79.9945,72.73477A8,8,0,0,0,40,115.53855V208a8,8,0,0,0,8,8H208a8,8,0,0,0,8-8V115.53887A8,8,0,0,0,213.3815,109.61945Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  ></path>
                }
                @case ('rocket') {
                  <rect width="256" height="256" fill="none"></rect>
                  <polyline
                    points="76.201 132.201 152.201 40.201 216 40 215.799 103.799 123.799 179.799"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  ></polyline>
                  <line
                    x1="100"
                    y1="156"
                    x2="160"
                    y2="96"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  ></line>
                  <path
                    d="M82.14214,197.45584,52.201,227.397a8,8,0,0,1-11.31371,0L28.603,215.11268a8,8,0,0,1,0-11.31371l29.94113-29.94112a8,8,0,0,0,0-11.31371L37.65685,141.65685a8,8,0,0,1,0-11.3137l12.6863-12.6863a8,8,0,0,1,11.3137,0l76.6863,76.6863a8,8,0,0,1,0,11.3137l-12.6863,12.6863a8,8,0,0,1-11.3137,0L93.45584,197.45584A8,8,0,0,0,82.14214,197.45584Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  ></path>
                }
                @case ('user') {
                  <rect width="256" height="256" fill="none"></rect>
                  <circle
                    cx="128"
                    cy="96"
                    r="64"
                    fill="none"
                    stroke="currentColor"
                    stroke-miterlimit="10"
                    stroke-width="16"
                  ></circle>
                  <path
                    d="M30.989,215.99064a112.03731,112.03731,0,0,1,194.02311.002"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  ></path>
                }
                @case ('chat') {
                  <rect width="256" height="256" fill="none"></rect>
                  <path
                    d="M45.42853,176.99811A95.95978,95.95978,0,1,1,79.00228,210.5717l.00023-.001L45.84594,220.044a8,8,0,0,1-9.89-9.89l9.47331-33.15657Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  ></path>
                  <line
                    x1="96"
                    y1="112"
                    x2="160"
                    y2="112"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  ></line>
                  <line
                    x1="96"
                    y1="144"
                    x2="160"
                    y2="144"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  ></line>
                }
              }
            </svg>
          </span>
          <span class="link-title">{{ item.title }}</span>
        </a>
      }
    </div>
  </div>
</nav>
