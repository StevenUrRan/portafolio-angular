<div class="contact-section">
  
  <!-- TÍTULO PRINCIPAL ARRIBA DE TODO -->
  <h1 class="section-title">Get in Touch</h1>

  <div class="contact-layout">

    <!-- CONTENEDOR IZQUIERDO: Detalles -->
    <div class="left-container">
      <div class="contact-info">
        <h2>Let's Talk</h2>
        <p>I'm always open to discussing new projects, creative ideas, or opportunities to be part of your visions.</p>
        
        <div class="info-details">
          <p><strong>Location:</strong> Bogota, Colombia</p>
          <p><strong>Email:</strong> contact@yourdomain.com</p>
        </div>
      </div>
    </div>

    <!-- CONTENEDOR DERECHO: Tu Tarjeta (.card) -->
    <div class="right-container">
      <div class="card">
        <a class="singup">Contact Us</a>
        
        <!-- Input: Full Name -->
        <div class="inputBox">
          <input type="text" required="required" name="name">
          <span>Full Name</span>
        </div>

        <!-- Input: Email -->
        <div class="inputBox1">
          <input type="text" required="required" name="email">
          <span class="user">Email</span>
        </div>

        <!-- Input: Message -->
        <div class="inputBox">
          <input type="text" required="required" name="message">
          <span>Message</span>
        </div>

        <button class="enter">Enter</button>
      </div>
    </div>

  </div>
</div>
