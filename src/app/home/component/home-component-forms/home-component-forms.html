<div class="contact-section">
  <div class="contact-shell">
    <div class="contact-copy">
      <span>Contacto</span>
      <h2>Hablemos de tu proximo proyecto</h2>
      <p>
        Estoy abierto a colaborar en productos web, APIs, automatizaciones o
        mejoras de arquitectura con Java y Angular.
      </p>

      <div class="contact-details">
        <a href="mailto:stevenurieles@gmail.com">stevenurieles@gmail.com</a>
        <small>Bogota, Colombia</small>
      </div>
    </div>

    <form class="contact-form">
      <label>
        <span>Nombre</span>
        <input type="text" name="name" placeholder="Tu nombre" />
      </label>

      <label>
        <span>Email</span>
        <input type="email" name="email" placeholder="correo@dominio.com" />
      </label>

      <label>
        <span>Mensaje</span>
        <textarea name="message" rows="5" placeholder="Cuentame que necesitas"></textarea>
      </label>

      <button type="submit">Enviar mensaje</button>
    </form>
  </div>
</div>
