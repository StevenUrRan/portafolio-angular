<section class="h-screen flex items-center justify-center p-4 relative">
  <div class="text-center">
    <h1 class="display-font text-7xl md:text-9xl font-bold leading-[0.85] tracking-tight mb-8">
      {{ env.hero }} <br />
      <span class="text-transparent stroke-text" style="-webkit-text-stroke: 2px black">{{
        env.hero1
      }}</span>
      <br />
      {{ env.hero2 }}
    </h1>
    <p class="max-w-md mx-auto text-zinc-500 font-medium leading-relaxed mb-8">
      {{ env.pHero }}
    </p>

    <!-- Botones CTA -->
    <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
      <a
        [routerLink]="['/home']"
        fragment="proyectos-seccion"
        class="w-full sm:w-auto inline-flex items-center justify-center px-8 py-4 bg-zinc-950 hover:bg-zinc-800 text-white font-semibold rounded-full tracking-wider transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg shadow-zinc-950/10 cursor-pointer"
      >
        <span>View Projects</span>
        <i class="ph ph-arrow-right ml-2 text-lg"></i>
      </a>
      <a
        [routerLink]="['/home']"
        fragment="contacto-seccion"
        class="w-full sm:w-auto inline-flex items-center justify-center px-8 py-4 bg-white hover:bg-zinc-50 text-zinc-900 border border-zinc-300 hover:border-zinc-800 font-semibold rounded-full tracking-wider transition-all duration-300 transform hover:scale-105 active:scale-95 cursor-pointer"
      >
        <span>Contact</span>
        <i class="ph ph-paper-plane-tilt ml-2 text-lg"></i>
      </a>
    </div>
  </div>

  <a
    [routerLink]="['/home']"
    fragment="proyectos-seccion"
    class="absolute bottom-10 left-1/2 transform -translate-x-1/2 md:left-10 md:translate-x-0 animate-bounce text-zinc-800 hover:text-zinc-500 cursor-pointer"
  >
    <i class="ph ph-arrow-down text-2xl"></i>
  </a>
</section>
